<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Portail : une arche de portail (l'accès) qui encadre un dossier (les fichiers), avec un cadenas
       (le chiffrement), sur un fond orange terracotta. Tout le dessin tient dans un cercle de rayon 150
       autour du centre : la zone sûre de l'icône adaptative (66 dp sur 108). -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E07B53"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="blanc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE8DD"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fond)"/>
  <circle cx="390" cy="110" r="160" fill="#FFFFFF" opacity="0.08"/>
  <g transform="translate(256,262) scale(0.86) translate(-256,-262)">
  <!-- ombre portée -->
  <g transform="translate(0,10)" fill="#7C2D12" opacity="0.28">
    <path fill-rule="evenodd" d="M160,372 V236 A96,96 0 0 1 352,236 V372 Z M188,372 V236 A68,68 0 0 1 324,236 V372 Z"/>
    <path d="M200,258 Q200,248 210,248 L238,248 L250,260 L302,260 Q312,260 312,270 L312,338 Q312,348 302,348 L210,348 Q200,348 200,338 Z"/>
    <rect x="140" y="372" width="232" height="18" rx="9"/>
  </g>
  <!-- arche du portail -->
  <path fill="url(#blanc)" fill-rule="evenodd"
        d="M160,372 V236 A96,96 0 0 1 352,236 V372 Z M188,372 V236 A68,68 0 0 1 324,236 V372 Z"/>
  <!-- seuil du portail -->
  <rect x="140" y="372" width="232" height="18" rx="9" fill="#FFE8DD"/>
  <!-- dossier -->
  <path fill="url(#blanc)"
        d="M200,258 Q200,248 210,248 L238,248 L250,260 L302,260 Q312,260 312,270 L312,338 Q312,348 302,348 L210,348 Q200,348 200,338 Z"/>
  <path fill="#F4B79C" d="M200,276 H312 V287 H200 Z"/>
  <!-- cadenas, détaché de l'arche par un liseré du fond -->
  <path fill="none" stroke="#C9531E" stroke-width="22" stroke-linecap="round"
        d="M311,330 V318 A15,15 0 0 1 341,318 V330"/>
  <rect x="294" y="324" width="64" height="52" rx="12" fill="#C9531E"/>
  <path fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"
        d="M311,330 V318 A15,15 0 0 1 341,318 V330"/>
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M308,330 H344 Q352,330 352,338 V362 Q352,370 344,370 H308 Q300,370 300,362 V338 Q300,330 308,330 Z
           M326,341 A6,6 0 0 1 329,352.2 L330,360 H322 L323,352.2 A6,6 0 0 1 326,341 Z"/>
  </g>
</svg>
